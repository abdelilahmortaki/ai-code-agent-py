# Runtime provider is selected explicitly with AI_PROVIDER=bedrock|azure.
# The default is bedrock; no automatic provider fallback exists.
# Azure embedding dimensions (F1.6 incremental reuse): set
# AZURE_EMBEDDING_DIMENSIONS to the deployment's output dimension so
# unchanged-file embeddings can be reused across versions instead of being
# re-embedded. text-embedding-3-large returns 3072 by default. If unset, the
# dimension is learned from the first real embedding and unchanged-file reuse
# is conservatively disabled.
bedrock:
  region: "us-east-1"                              # override with AWS_REGION
  model_id: "qwen.qwen3-coder-30b-a3b-v1:0"       # override with BEDROCK_MODEL_ID
  embeddings_model_id: "amazon.titan-embed-text-v2:0"
  temperature: 0.1                                 # override with BEDROCK_TEMPERATURE
  max_tokens: 32384                                # override with BEDROCK_MAX_TOKENS
agent:
  active_project: ""
  max_attempts: 3
  max_context_files: 4      # number of *full files* to include (was max_context_chunks)
  max_file_chars: 6000
  upload_allowed_extensions: [java, xml, yml, yaml, properties, json, md, txt]
  upload_max_file_bytes: 153600
  upload_max_total_bytes: 10485760
  # F3 FinOps guardrail — per-invocation input/context limits.
  # effective_input_budget = min(ticket, project, model). unset (null) = no limit.
  finops_ticket_token_limit: null
  finops_project_token_limit: null
  finops_model_token_limit: null
  finops_max_reduction_rounds: 3
  # TEST pricing values — NOT authoritative cloud prices. Configure real
  # prices here before relying on cost estimates in production; unconfigured
  # models report cost "unavailable" instead of a fabricated number.
  finops_pricing:
    azure:
      gpt-5-mini:
        input_per_million: 1.10
        output_per_million: 4.40
    bedrock:
      qwen.qwen3-coder-30b-a3b-v1:0:
        input_per_million: 0.50
        output_per_million: 1.00
  # F4 smart routing (after provider selection). Profiles resolve to
  # provider-local retrieval + generation knobs. model_overrides per provider
  # map profile -> deployment/model id; when unset the configured default is
  # used (the VM has a single real Azure deployment).
  routing:
    profiles:
      economical:
        graph_depth: 0
        top_k: 5
        max_related: 4
        context_budget: 6000
        max_context_files: 3
        max_output_tokens: 8192
      strong:
        graph_depth: 1
        top_k: 10
        max_related: 8
        context_budget: null
        max_context_files: 6
        max_output_tokens: 16384
    policy:
      P1: {LOW: strong, MEDIUM: strong, HIGH: strong}
      P2: {LOW: strong, MEDIUM: strong, HIGH: strong}
      P3: {LOW: economical, MEDIUM: economical, HIGH: strong}
      P4: {LOW: economical, MEDIUM: economical, HIGH: economical}
    model_overrides: {}
  # F5 disposable validation + bounded repair.
  validation_enabled: true
  test_selection_fallback: none
  max_repair_attempts: 2
  projects: []              # empty — projects are added at runtime via Browse Folder

# Optional PostgreSQL persistence (F1.1) — DISABLED by default.
# Enable by uncommenting the block below, or by setting DATABASE_URL.
# database:
#   url: "postgresql://postgres:password@localhost:5432/agentdb"
